[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-monitoring-service"
version = "0.1.1"
description = "Windows service, IIS, disk, and server health monitoring agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "psutil>=6.1,<8",
  "pywin32>=308; sys_platform == 'win32'",
  "requests>=2.32,<3",
  "cryptography>=44,<47",
  "tzdata>=2026.1",
  "pyodbc>=5.2,<6",
  "python-docx>=1.2,<2",
  "reportlab>=5.1,<6",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyinstaller>=6.11", "pypdf>=7,<8"]

[project.scripts]
mi-monitoring-service = "millensys_guardian.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

